name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Headless matplotlib: pick the Agg backend explicitly so importing
    # utils.utils_image (which imports matplotlib.pyplot) never needs a display.
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies (from uv.lock)
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -q
