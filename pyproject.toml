[project]
name = "autodeepinv"
version = "0.1.0"
description = "End-to-end eval: deepinv's DRUNet (KAIR weights) vs KAIR benchmark on Set5"
requires-python = ">=3.10"
dependencies = [
    # --- torch family: pulled from the CUDA 12.8 (cu128) index below (mirrors KAIR) ---
    # cu128 builds include Blackwell (sm_120) support for RTX 5070 Ti and only
    # need NVIDIA driver R570+ (572.x). Matches KAIR's environment so the deepinv
    # shim runs on the same toolchain and the same torch build that produced the
    # reference benchmark numbers.
    "torch==2.11.0",
    "torchvision==0.26.0",

    # --- rest from PyPI ---
    "opencv-python-headless",   # headless build: works in CI / no display
    "numpy",
    "matplotlib",                # imported at top of utils/utils_image.py
]

[dependency-groups]
# Dev-only tools (not part of the runtime environment).
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# Source code lives in the `AutoDeepInv/` package subdir (repo root is also
# named AutoDeepInv, so this is the inner one: <repo>/AutoDeepInv/AutoDeepInv/).
# Putting it on sys.path lets the existing `import utils.utils_image` /
# `import config_schema` (tests + scripts) keep resolving after the migration,
# without editing those files. Without this, pytest's prepend import mode would
# insert tests/utils/ and `import utils` would fail.
pythonpath = ["AutoDeepInv"]
testpaths = ["tests"]

[tool.uv]
package = false

# PyTorch publishes CUDA-enabled wheels on its own index.
# Mark it explicit so uv only uses it for the packages listed in [tool.uv.sources],
# leaving everything else on PyPI (the cu128 index only hosts torch-related wheels).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
